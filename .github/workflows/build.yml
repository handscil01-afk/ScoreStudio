name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

# Only one run at a time may replace the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ScoreStudio.sln

      - name: Build (warnings are errors)
        run: dotnet build ScoreStudio.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ScoreStudio.sln -c Release --no-build --logger "console;verbosity=normal"
        env:
          # ScoreStudio.Tests writes PNG previews of the sample score here.
          SCORESTUDIO_PREVIEW_DIR: ${{ github.workspace }}/preview

      - name: Publish app
        run: dotnet publish ScoreStudio/ScoreStudio.csproj -c Release --no-restore -o publish

      - uses: actions/upload-artifact@v6
        with:
          name: ScoreStudio-win-x64
          path: publish/
          if-no-files-found: error

      # A release asset has a fixed download link, which is easier to use than an Actions artifact.
      - name: Update "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd publish && 7z a -tzip ../ScoreStudio-win-x64.zip . > /dev/null)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScoreStudio-win-x64.zip preview/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "최신 개발 빌드 (${GITHUB_SHA::7})" \
            --notes "main 브랜치의 최신 자동 빌드입니다. 아직 개발 중인 버전입니다. 악보 화면은 음표·쉼표·조표·빔·붙임줄·가사·코드 이름·도돌이표·볼타·음자리표 변경·옥타브 기호(8va 등)를 그리고, 원본의 보표 크기·간격과 줄·페이지 나눔을 따릅니다. 키보드로 음표·쉼표를 입력하고 고칠 수 있습니다(편집 > 키보드 입력 방법). 셈여림·이음줄·아티큘레이션은 아직 그리지 않습니다. 마우스로 음높이 입력, MUSX 변환, PDF 출력은 구현되지 않았습니다. 실행하려면 .NET 8 Desktop Runtime이 필요합니다. preview-*.png는 샘플 악보와 가져온 MusicXML 샘플, 입력 도구 모음의 음표 아이콘을 이 빌드의 WPF 렌더러로 그린 화면입니다."
